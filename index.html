<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Statistical Test Selector</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:		#f6a78b;
    margin:0;
    padding:20px;
    color:		rgb(83, 15, 97);
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#eaebdb;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 12px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#a5c50b;
}

h2{
    text-align:center;
}

button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.option{
    background:#e79494;
    color:rgb(83, 15, 97);
}

.option:hover{
    background:#a5c50b;
}

.back{
    background:		rgb(83, 15, 97)
    ;
    color:	#eaebdb;
}

.back:hover{
    background:#a5c50b;
}

.result{
    background:	#eaebdb;
    border-left:5px solid #a5c50b;
    padding:20px;
    margin-top:20px;
    border-radius:8px;
}

pre{
    background:#1f2937;
    color:#eaebdb;
    padding:15px;
    border-radius:8px;
    overflow:auto;
}

.section{
    margin-top:20px;
}

ul{
    line-height:1.8;
}

.small{
    color:rgb(83, 15, 97);
    font-size:0.95em;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<h1> 🔢 Statistical Test Selector 🔢 </h1>

<div id="app"></div>

</div>

</div>

<script>

const app = document.getElementById("app");
const historyStack = [];

function show(node){
    historyStack.push(node);
    render(node);
}

function back(){
    historyStack.pop();
    render(historyStack[historyStack.length-1]);
}
function goHome(){

    historyStack.length = 0;

    historyStack.push(startNode);

    render(startNode);

}

function render(node){

    let html = `
    <h2>${node.question}</h2>
    `;

    if(historyStack.length > 1){
    html += `<button class="back" onclick="back()">⬅ Back</button>`;

    html += `<button class="back" onclick="goHome()">🏠 Main Menu</button>`;
}

    if(node.options){

        node.options.forEach(opt=>{
            html += `
            <button class="option"
            onclick="${opt.action}">
            ${opt.label}
            </button>
            `;
        })

    }

    if(node.result){

        html += `

        <div class="result">

        <h2>${node.result.title}</h2>

        <p>${node.result.description}</p>

        <h3>Recommended R code</h3>

        <pre>${node.result.code}</pre>

        <div class="section">

        <h3>Check assumptions</h3>

        <pre>${node.result.assumptions}</pre>

        </div>

        <div class="section">

        <h3>How to interpret results</h3>

        <ul>

        <li><strong>p &lt; 0.05</strong> → Significant</li>
        <li><strong>p &gt; 0.05</strong> → Not significant</li>
        <li><strong>Positive estimate</strong> → Positive effect</li>
        <li><strong>Negative estimate</strong> → Negative effect</li>
        <li><strong>Higher R²</strong> → More variation explained</li>

        </ul>

        </div>

        </div>
        `;
    }

    app.innerHTML = html;

}

function resultNode(title,description,code){

return {
question:"✅ Recommended Analysis",
result:{
title:title,
description:description,
code:code,
assumptions:
`qqnorm(residuals(model))
qqline(residuals(model))

shapiro.test(residuals(model))

plot(model)`
}
}

}

const startNode = {

question:"",

options:[

{
label:"📊 Find a Statistical Test",
action:"show(testSelectorNode)"
},

{
label:"📚 Definitions",
action:"show(definitionsNode)"
},

{
label:"✅ Assumption Guide",
action:"show(assumptionNode)"
}

]

};
const testSelectorNode = {

question:"What is your RESPONSE variable?",

options:[

{
label:"Continuous",
action:"show(continuousNode)"
},

{
label:"Binary",
action:"show(binaryNode)"
},

{
label:"Count",
action:"show(countNode)"
},

{
label:"Time to event / survival",
action:"show(survivalNode)"
}

]

};
const definitionsNode = {
 
question:"📚 Definitions",
 
options:[
 
{
label:"Response Variable",
action:"show(responseDefinitionNode)"
},
 
{
label:"Predictor Variable",
action:"show(predictorDefinitionNode)"
},
 
{
label:"Fixed Factor",
action:"show(fixedDefinitionNode)"
},
 
{
label:"Random Factor",
action:"show(randomDefinitionNode)"
}
 
]
 
};

const continuousNode = {

question:"Are observations independent?",

options:[

{
label:"Yes (one measurment per fish, fish from large population)",
action:"show(predictorNode)"
},

{
label:"No (several fish from same tank, day, site, repeated measures)",
action:"show(mixedNode)"
}

]

};

const predictorNode = {

question:"How many predictors do you have?",

options:[

{
label:"One predictor",
action:"show(onePredictorNode)"
},

{
label:"Several predictors",
action:"show(severalPredictorsNode)"
}

]

};

const onePredictorNode = {

question:"Is the predictor categorical (factor)?",

options:[

{
label:"Yes",
action:"show(factorNode)"
},

{
label:"No (numeric)",
action:"show(regressionCheckNode)"
}

]

};

const regressionCheckNode = {

question:"Were assumptions checked and reasonably met?",

options:[

{
label:"Yes",
action:"show(linearRegressionNode)"
},

{
label:"No / Unsure",
action:"show(spearmanNode)"
}

]

};

const factorNode = {

question:"How many levels?",

options:[

{
label:"2 levels (low, high)",
action:"show(twoGroupCheckNode)"
},

{
label:"More than 2 levels (low, medium, high)",
action:"show(multiGroupCheckNode)"
}

]

};

const twoGroupCheckNode = {

question:"Were assumptions checked and reasonably met?",

options:[

{
label:"Yes",
action:"show(tTestNode)"
},

{
label:"No / Unsure",
action:"show(wilcoxNode)"
}

]

};
const multiGroupCheckNode = {

question:"Were assumptions checked and reasonably met?",

options:[

{
label:"Yes",
action:"show(anovaNode)"
},

{
label:"No / Unsure",
action:"show(kruskalNode)"
}

]

};

const severalPredictorsNode = {

question:"What type of predictors do you have?",

options:[

{
label:"Factors only",
action:"show(factorialAnovaNode)"
},

{
label:"Numeric only",
action:"show(multipleRegressionNode)"
},

{
label:"Factors and Numeric variables",
action:"show(ancovaNode)"
}

]

};

const tTestNode =
resultNode(
"T-test",
"Compare a continuous response between two groups.",
`t.test(Y ~ Group, data=mydata)`
);

const wilcoxNode =
resultNode(
"Wilcoxon Rank-Sum Test",

"Non-parametric alternative to a t-test for comparing two groups.",

`wilcox.test(Y ~ Group,
             data=mydata)`
);

const anovaNode =
resultNode(
"ANOVA",
"Compare a continuous response across more than two groups.",
`model <- lm(Y ~ Group, data=mydata)

anova(model)

summary(model)`
);
const kruskalNode =
resultNode(
"Kruskal-Wallis Test",

"Non-parametric alternative to ANOVA.",

`kruskal.test(Y ~ Group,
              data=mydata)`
);

const linearRegressionNode =
resultNode(
"Linear Regression",
"Relationship between a continuous response and one numeric predictor.",
`model <- lm(Y ~ X, data=mydata)

summary(model)`
);

const spearmanNode =
resultNode(
"Spearman Correlation",

"Non-parametric alternative to Pearson correlation. Useful when assumptions are not met or when relationships are monotonic but not linear.",

`cor.test(X,
          Y,
          method="spearman")`
);

const factorialAnovaNode =
resultNode(
"Factorial ANOVA",
"Several categorical predictors.",
`model <- lm(Y ~ A + B + C,
            data=mydata)

anova(model)`
);

const multipleRegressionNode =
resultNode(
"Multiple Regression",
"Several numeric predictors.",
`model <- lm(Y ~ X1 + X2 + X3,
            data=mydata)

summary(model)`
);

const ancovaNode =
resultNode(
"ANCOVA / Multiple Linear Regression",
"Factors and numeric covariates together.",
`model <- lm(Y ~ Factor +
                 Covariate1 +
                 Covariate2,
            data=mydata)

anova(model)

summary(model)`
);

const mixedNode =
resultNode(
"Mixed Model",
"Data are grouped or repeated.",
`library(lme4)

model <- lmer(Y ~ A + B +
              (1|Group),
              data=mydata)

summary(model)`
);

const binaryNode =
resultNode(
"Logistic Regression",
"Binary response variable.",
`model <- glm(Y ~ predictors,
             family='binomial',
             data=mydata)

summary(model)`
);

const countNode =
resultNode(
"Poisson Regression",
"Count response variable.",
`model <- glm(Y ~ predictors,
             family='poisson',
             data=mydata)

summary(model)`
);

const survivalNode =
resultNode(
"Cox Proportional Hazards Model",
"Time-to-event response variable.",
`library(survival)

model <- coxph(
Surv(time,event) ~ predictors,
data=mydata)

summary(model)`
);

const assumptionNode =
resultNode(
"Assumption Guide",

"Use these checks before selecting a parametric analysis.",

`qqnorm(residuals(model))

qqline(residuals(model))

hist(residuals(model))

shapiro.test(residuals(model))

plot(model)`
);

const responseDefinitionNode =
resultNode(
"Response Variable",

"The variable you want to explain, predict, or compare.",

`Examples:

• Plasma cortisol

• Weight

• Length

• Monoaminergic activity`
);

const predictorDefinitionNode =
resultNode(
"Predictor Variable",

"A variable that might influence or explain changes in the response variable.",

`Examples:

• Age

• Sex

• Treatment`
);

const fixedDefinitionNode =
resultNode(
"Fixed Factor",

"A categorical variable whose specific levels are of direct interest and are deliberately chosen by the researcher.",

`Examples:

• Sex

• Fishing treatment

• Country

You are interested in comparing these specific groups.`
);

const randomDefinitionNode =
resultNode(
"Random Factor",

"A categorical variable whose levels are not the main focus of the study but may introduce variation in the data.",

`Examples:

• Sampling day

• Tank

• Site

• Observer

• Fish ID (for repeated measurements)

These factors are usually included to account for variability rather than to compare the groups themselves.`
);

render(startNode);
historyStack.push(startNode);

</script>

</body>
</html>
